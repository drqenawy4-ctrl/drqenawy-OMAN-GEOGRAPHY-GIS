<style>
.virtual-tour {
  background:#102b3f;
  color:white;
  padding:16px;
  border-radius:15px;
  margin-top:18px;
}
.virtual-tour iframe {
  width:100%;
  height:470px;
  border:0;
  border-radius:12px;
  background:#172b3c;
}
.virtual-tour h3 { color:#e5c47b; }
.virtual-tour a {
  display:inline-block;
  padding:11px 15px;
  background:#d5a84f;
  color:#102b3f;
  text-decoration:none;
  border-radius:8px;
  margin-top:10px;
  font-weight:bold;
}
</style>

<div class="virtual-tour">
  <h3>🌐 جولة داخل المعلم بزاوية 360°</h3>
  <p id="tour-name">اختر معلمًا لبدء الجولة</p>
  <iframe id="matterport-frame"
    title="الجولة الافتراضية"
    allow="fullscreen; vr"
    allowfullscreen>
  </iframe>
  <a id="open-tour" href="#" target="_blank"
     rel="noopener noreferrer">
     فتح الجولة بحجم كامل
  </a>
</div>

<script>
const officialTours = {
  jabreen: "https://my.matterport.com/show/?m=QgqPGf6a5Np",
  hazm: "https://my.matterport.com/show/?m=kfEWtigW7cj",
  sohar: "https://my.matterport.com/show/?m=Cd2DPdi93XH",
  khasab: "https://my.matterport.com/show/?m=rUNhaKWuT5K",
  mirbat: "https://my.matterport.com/show/?m=ugqMv9i3dob"
};

function showVirtualTour(siteId, siteName) {
  const url = officialTours[siteId];
  const frame = document.getElementById("matterport-frame");
  const open = document.getElementById("open-tour");
  const name = document.getElementById("tour-name");

  name.textContent = siteName;

  if (!url) {
    frame.src = "about:blank";
    open.href = "https://experienceoman.om/360-virtual-tours";
    name.textContent += " — لا توجد جولة مؤكدة لهذا المعلم في القائمة الرسمية.";
    return;
  }

  frame.src = url + "&play=1";
  open.href = url;
}
</script>
