<!-- =========================================
     إضافة الجولات الافتراضية للمعالم العمانية
     لا تحذف أي كود موجود في موقعك
========================================= -->

<style>
.virtual-tour-btn {
  display: inline-block;
  margin-top: 10px;
  padding: 11px 18px;
  border: 0;
  border-radius: 9px;
  background: #087f75;
  color: white;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}
.virtual-tour-btn:hover {
  background: #05645d;
}
#oman-tour-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0,0,0,.94);
  padding: 15px;
}
#oman-tour-modal.active {
  display: flex;
  flex-direction: column;
}
#oman-tour-modal iframe {
  width: 100%;
  flex: 1;
  min-height: 300px;
  border: 0;
  border-radius: 10px;
  background: #111;
}
.oman-tour-close {
  align-self: flex-end;
  margin-bottom: 10px;
  padding: 10px 18px;
  background: #b83232;
  color: white;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
.oman-tour-open {
  color: white;
  text-align: center;
  padding: 12px;
}
</style>

<div id="oman-tour-modal" aria-hidden="true">
  <button class="oman-tour-close" onclick="closeOmanTour()">
    ✕ إغلاق الجولة
  </button>
  <iframe id="oman-tour-frame"
    title="الجولة الافتراضية داخل المعلم"
    allow="fullscreen; xr-spatial-tracking"
    allowfullscreen>
  </iframe>
  <a id="oman-tour-external"
     class="oman-tour-open"
     target="_blank"
     rel="noopener">
     إذا لم تظهر الجولة هنا، اضغط لفتحها في نافذة جديدة
  </a>
</div>

<script>
/*
  روابط Matterport التي أُدرجت في النسخة السابقة.
  يجب اختبار كل رابط؛ لا يعني إدراجه أنه متاح حاليًا.
*/
const OMAN_VIRTUAL_TOURS = {
  "جبرين": "https://my.matterport.com/show/?m=QgqPGf6a5Np",
  "الحزم": "https://my.matterport.com/show/?m=kfEWtigW7cj",
  "صحار": "https://my.matterport.com/show/?m=Cd2DPdi93XH",
  "خصب": "https://my.matterport.com/show/?m=rUNhaKWuT5K",
  "مرباط": "https://my.matterport.com/show/?m=ugqMv9i3dob"
};

function openOmanTour(name) {
  const url = OMAN_VIRTUAL_TOURS[name];

  if (!url) {
    alert("لا تتوفر جولة مباشرة مؤكدة لهذا المعلم حتى الآن.");
    return;
  }

  const modal = document.getElementById("oman-tour-modal");
  const frame = document.getElementById("oman-tour-frame");
  const external = document.getElementById("oman-tour-external");

  frame.src = url;
  external.href = url;
  modal.classList.add("active");
  modal.setAttribute("aria-hidden", "false");
}

function closeOmanTour() {
  const modal = document.getElementById("oman-tour-modal");
  const frame = document.getElementById("oman-tour-frame");

  modal.classList.remove("active");
  modal.setAttribute("aria-hidden", "true");
  frame.src = "about:blank";
}

/*
  إضافة زر الجولة إلى بطاقة المعلم.
  استخدم:
  addOmanTourButton("جبرين", عنصر البطاقة)
*/
function addOmanTourButton(name, card) {
  if (!card || !OMAN_VIRTUAL_TOURS[name]) return;

  if (card.querySelector(".virtual-tour-btn")) return;

  const button = document.createElement("button");
  button.className = "virtual-tour-btn";
  button.type = "button";
  button.textContent = "🎥 ابدأ الجولة الافتراضية";
  button.addEventListener("click", function () {
    openOmanTour(name);
  });

  card.appendChild(button);
}
</script>
