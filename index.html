<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

(() => {
  const stations = [
    "مدخل المدرسة والبوابة الرئيسية",
    "جوانب المدرسة – الأيمن والأيسر",
    "الممرات الداخلية والدرج – الجانب الأيسر",
    "الممرات الداخلية والدرج – الجانب الأيمن",
    "غرفة المعلمين الأولى",
    "غرفة المعلمين الثانية",
    "الفصول الدراسية",
    "المرافق التعليمية",
    "المختبرات المدرسية",
    "المكتبة المدرسية",
    "الساحة المدرسية",
    "مختبر الجغرافيا والتقنيات الحديثة",
    "قاعة الأنشطة والابتكار"
  ];

  const tourStage = document.getElementById("tourStage");
  if (!tourStage) return;

  const panel = document.createElement("section");
  panel.style.cssText = `
    margin-top:18px;padding:15px;border-radius:20px;
    background:#0b2639;border:1px solid #d8b46a88;color:white
  `;

  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <h3 style="margin:0;color:#f0d89d">🌐 التجوّل داخل مدرسة ثابت بن قيس – 3D</h3>
      <span id="school3dStatus" style="font-size:12px;color:#55d6d2">إعداد المشهد...</span>
    </div>
    <div style="position:relative;height:460px;background:#071b2b;border-radius:15px;overflow:hidden">
      <canvas id="school3dCanvas" style="width:100%;height:100%;display:block"></canvas>
      <div id="school3dTitle" style="position:absolute;top:12px;right:12px;background:#071b2bdd;padding:9px 13px;border-radius:10px;font-size:13px">
        المحطة الأولى
      </div>
      <div style="position:absolute;bottom:10px;left:10px;background:#071b2bdd;padding:7px 10px;border-radius:9px;font-size:11px">
        اسحب للتجول والدوران · استخدم عجلة الفأرة للتقريب والإبعاد
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button id="school3dPrev" class="btn btn-outline">المحطة السابقة</button>
      <button id="school3dNext" class="btn btn-gold">المحطة التالية</button>
      <button id="school3dReset" class="btn btn-outline">إعادة زاوية الرؤية</button>
      <button id="school3dAuto" class="btn btn-cyan">بدء الجولة التلقائية</button>
    </div>
    <div id="school3dGallery" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:9px;margin-top:15px"></div>
    <p style="font-size:12px;color:#a9bdc9;margin-bottom:0">
      تُحمّل الصور المنشورة في مستودع GitHub العام وتُعرض على لوحات داخل المشهد ثلاثي الأبعاد.
    </p>
  `;

  tourStage.insertAdjacentElement("afterend", panel);

  const canvas = document.getElementById("school3dCanvas");
  const status = document.getElementById("school3dStatus");
  const title = document.getElementById("school3dTitle");
  const gallery = document.getElementById("school3dGallery");

  let scene, camera, renderer, controls;
  let current = 0;
  let autoTimer = null;
  let photoObjects = [];
  const loader = new THREE.TextureLoader();

  function material(color) {
    return new THREE.MeshStandardMaterial({
      color,
      roughness: 0.85
    });
  }

  function block(parent, w, h, d, x, y, z, mat) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d), mat
    );
    mesh.position.set(x, y, z);
    parent.add(mesh);
    return mesh;
  }

  function buildSchool() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071b2b);
    scene.fog = new THREE.Fog(0x071b2b, 18, 42);

    camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
    camera.position.set(0, 2.5, 8);

    renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    scene.add(new THREE.HemisphereLight(0xd9efff, 0x263443, 2));

    const light = new THREE.DirectionalLight(0xffe4bd, 2.2);
    light.position.set(3, 8, 5);
    scene.add(light);

    const school = new THREE.Group();
    scene.add(school);

    const floor = material(0x9ba4a8);
    const walls = material(0xe4e6e3);
    const brown = material(0x795638);
    const gold = material(0xc5a15c);
    const roof = material(0xbfc9ce);

    // أرضية الممر والسقف والجدران
    block(school, 8, .18, 35, 0, -.12, -11, floor);
    block(school, 8, .15, 35, 0, 4, -11, roof);
    block(school, .2, 4, 35, -4, 1.9, -11, walls);
    block(school, .2, 4, 35, 4, 1.9, -11, walls);

    // أبواب الفصول على جانبي الممر
    for (let z = 3; z > -28; z -= 4) {
      block(school, 1.5, 2.7, .12, -3.83, 1.35, z, brown);
      block(school, 1.5, 2.7, .12, 3.83, 1.35, z, brown);

      block(school, 1.7, .12, .2, -3.82, 2.75, z, gold);
      block(school, 1.7, .12, .2, 3.82, 2.75, z, gold);

      const lamp = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, .06, .35),
        new THREE.MeshBasicMaterial({ color: 0xffefca })
      );
      lamp.position.set(0, 3.88, z);
      school.add(lamp);
    }

    // بوابة دخول رمزية
    block(school, 2.8, 2.9, .25, 0, 1.4, 5.5, gold);
    block(school, 2.4, 2.5, .12, 0, 1.25, 5.3, brown);

    // لوحة اسم المدرسة
    const signCanvas = document.createElement("canvas");
    signCanvas.width = 512;
    signCanvas.height = 128;
    const ctx = signCanvas.getContext("2d");
    ctx.fillStyle = "#102f43";
    ctx.fillRect(0, 0, 512, 128);
    ctx.fillStyle = "#f0d89d";
    ctx.font = "bold 38px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("مدرسة ثابت بن قيس", 256, 78);

    const signTexture = new THREE.CanvasTexture(signCanvas);
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(3.7, .85),
      new THREE.MeshBasicMaterial({ map: signTexture })
    );
    sign.position.set(0, 3.4, 5.32);
    school.add(sign);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = .07;
    controls.minDistance = 2.5;
    controls.maxDistance = 22;
    controls.maxPolarAngle = Math.PI * .48;
    controls.target.set(0, 1.5, 0);

    resize();
    window.addEventListener("resize", resize);
    animate();

    status.textContent = "المشهد الثلاثي الأبعاد جاهز";
  }

  function resize() {
    if (!renderer) return;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function animate() {
    requestAnimationFrame(animate);
    controls?.update();
    renderer?.render(scene, camera);
  }

  function moveToStation(index) {
    current = (index + stations.length) % stations.length;

    const z = 4 - current * 2.35;
    camera.position.set(0, 2.5, z + 4.5);
    controls.target.set(0, 1.5, z);
    controls.update();

    title.textContent =
      `المحطة ${String(current + 1).padStart(2, "0")} · ${stations[current]}`;
  }

  function guessStation(path, index) {
    const n = path.toLowerCase();

    const keywords = [
      ["مدخل", "بوابة", "gate", "entrance"],
      ["جانب", "واجهة", "side"],
      ["ممر", "درج", "سلم", "stair", "corridor"],
      ["يمين", "يسار"],
      ["معلمين", "teacher"],
      ["غرفة", "teachers"],
      ["فصل", "صف", "class"],
      ["مرفق", "facility"],
      ["مختبر", "معمل", "lab"],
      ["مكتبة", "library"],
      ["ساحة", "ملعب", "yard"],
      ["جغرافيا", "خرائط", "gis", "geography"],
      ["أنشطة", "ابتكار", "قاعة", "activity"]
    ];

    for (let i = 0; i < keywords.length; i++) {
      if (keywords[i].some(word => n.includes(word))) return i;
    }
    return index % stations.length;
  }

  function clearPhotoPanels() {
    photoObjects.forEach(obj => {
      scene.remove(obj);
      obj.material.map?.dispose();
      obj.material.dispose();
    });
    photoObjects = [];
  }

  function showPhotos(images) {
    clearPhotoPanels();

    const assigned = Array.from(
      { length: stations.length },
      (_, i) => images.filter(x => x.station === i)
    );

    assigned.forEach((items, i) => {
      if (!items.length) return;

      const side = i % 2 === 0 ? -1 : 1;
      const z = 3 - i * 2.35;

      loader.load(items[0].url, texture => {
        texture.colorSpace = THREE.SRGBColorSpace;

        const plane = new THREE.Mesh(
          new THREE.PlaneGeometry(2.4, 1.55),
          new THREE.MeshBasicMaterial({
            map: texture,
            side: THREE.DoubleSide
          })
        );

        plane.position.set(side * 3.78, 2, z);
        plane.rotation.y = side < 0 ? Math.PI / 2 : -Math.PI / 2;

        scene.add(plane);
        photoObjects.push(plane);
      });
    });
  }

  async function loadGitHubPhotos() {
    const owner = "drqenawy4-ctrl";
    const repo = "drqenawy-OMAN-GEOGRAPHY-GIS";

    try {
      const metaResponse = await fetch(
        `https://api.github.com/repos/${owner}/${repo}`
      );
      if (!metaResponse.ok) throw new Error("تعذر الوصول إلى مستودع GitHub");

      const meta = await metaResponse.json();
      const branch = meta.default_branch || "main";

      const response = await fetch(
        `https://api.github.com/repos/${owner}/${repo}/git/trees/${encodeURIComponent(branch)}?recursive=1`
      );
      if (!response.ok) throw new Error("تعذر قراءة ملفات المستودع");

      const data = await response.json();

      const files = (data.tree || [])
        .filter(file =>
          file.type === "blob" &&
          /\.(jpg|jpeg|png|webp|gif|avif)$/i.test(file.path)
        )
        .sort((a, b) => a.path.localeCompare(b.path));

      const images = files.map((file, index) => ({
        name: file.path.split("/").pop(),
        url: `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${file.path.split("/").map(encodeURIComponent).join("/")}`,
        station: guessStation(file.path, index)
      }));

      gallery.innerHTML = images.map(image => `
        <figure style="margin:0;background:#071f30;border-radius:10px;overflow:hidden">
          <img src="${image.url}" loading="lazy"
            style="width:100%;height:100px;object-fit:cover"
            alt="${image.name}">
          <figcaption style="padding:5px;font-size:11px">
            ${image.name}<br>
            <span style="color:#55d6d2">${stations[image.station]}</span>
          </figcaption>
        </figure>
      `).join("");

      showPhotos(images);
      status.textContent = `تم تحميل ${images.length} صورة`;
    } catch (error) {
      console.error(error);
      status.textContent = "تعذر تحميل الصور من المستودع";
    }
  }

  document.getElementById("school3dPrev").onclick =
    () => moveToStation(current - 1);

  document.getElementById("school3dNext").onclick =
    () => moveToStation(current + 1);

  document.getElementById("school3dReset").onclick =
    () => moveToStation(current);

  document.getElementById("school3dAuto").onclick = event => {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
      event.currentTarget.textContent = "بدء الجولة التلقائية";
    } else {
      event.currentTarget.textContent = "إيقاف الجولة التلقائية";
      autoTimer = setInterval(
        () => moveToStation(current + 1), 4500
      );
    }
  };

  // مزامنة المحطة مع أزرار الجولة الأصلية في الموقع
  const titleObserver = new MutationObserver(() => {
    const text = document.getElementById("stationTitle")?.textContent || "";
    const match = text.match(/المحطة\s*(\d+)/);
    if (match) moveToStation(Number(match[1]) - 1);
  });

  const stationTitle = document.getElementById("stationTitle");
  if (stationTitle) {
    titleObserver.observe(stationTitle, {
      childList: true,
      characterData: true,
      subtree: true
    });
  }

  buildSchool();
  moveToStation(0);
  loadGitHubPhotos();
})();
</script>
</body>
</html>
