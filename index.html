<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاتحاد المستكشف العماني | أ.د. قناوي حسين</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts - Amiri, Cairo & Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;0,900;1,700&family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        amiri: ['Amiri', 'serif'],
                        tajawal: ['Tajawal', 'sans-serif'],
                    },
                    colors: {
                        omanRed: '#C8102E',
                        omanGreen: '#00853F',
                        royalGold: '#D4AF37',
                        goldHover: '#F3E5AB',
                        darkNavy: '#070B14',
                        panelNavy: '#0F172A',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #04060B;
            color: #F8FAFC;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 1. خلفية القلاع والحصون العمانية مع تظليل داكن فخم جداً */
        .castles-forts-bg {
            background: linear-gradient(180deg, rgba(4, 6, 11, 0.90) 0%, rgba(15, 23, 42, 0.93) 50%, rgba(4, 6, 11, 0.96) 100%), 
                        url('https://images.unsplash.com/photo-1584646098378-0874589d76b1?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* بطاقات زجاجية فاخرة */
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .gold-glow {
            text-shadow: 0 0 18px rgba(212, 175, 55, 0.6);
        }

        .gold-border-lg {
            border: 2px solid rgba(212, 175, 55, 0.5);
        }

        .tab-active {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: #070B14 !important;
            font-weight: 900;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
        }

        .map-card-hover {
            transition: all 0.4s ease;
        }
        .map-card-hover:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #D4AF37;
            box-shadow: 0 20px 35px rgba(212, 175, 55, 0.25);
        }

        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #04060B;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 4px;
        }
    </style>
</head>
<body class="castles-forts-bg flex flex-col min-h-screen">

    <!-- 🌟 شريط الهوية الرسمية لسلطنة عُمان -->
    <div class="bg-gradient-to-r from-omanRed via-darkNavy to-omanGreen text-white text-xs sm:text-sm py-2 px-4 text-center font-bold tracking-wider border-b border-royalGold/40 flex justify-center items-center gap-3">
        <span>🇴🇲 سلطنة عُمان</span>
        <span>•</span>
        <span>الاتحاد المستكشف العماني لنظم المعلومات الجغرافية والاستشعار عن بعد</span>
        <span>•</span>
        <span class="text-royalGold">إشراف: أ.د. قناوي حسين</span>
    </div>

    <!-- 🏛️ الهيدر الرئيسي وتوقيع أ.د. قناوي حسين -->
    <header class="glass-panel sticky top-0 z-50 px-4 sm:px-10 py-4 border-b border-royalGold/40">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- الشعار والاتحاد -->
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-royalGold via-amber-500 to-omanRed flex items-center justify-center text-darkNavy font-black text-2xl shadow-xl border-2 border-white">
                    <i class="fa-solid fa-chess-rook text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black text-royalGold font-amiri tracking-wide">الاتحاد المستكشف العماني</h1>
                    <p class="text-xs text-slate-300 font-medium">Oman GIS & Remote Sensing Heritage Union</p>
                </div>
            </div>

            <!-- التوقيع الرسمي للعملاق د. قناوي -->
            <div class="bg-darkNavy/90 px-6 py-2.5 rounded-2xl border-2 border-royalGold shadow-2xl flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-royalGold/20 text-royalGold flex items-center justify-center text-xl">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-royalGold font-bold block uppercase tracking-wider">إعداد وتصميم وتنفيذ العالم التربوي</span>
                    <span class="text-base sm:text-lg font-black text-white font-amiri">أ.د. قناوي حسين</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 📌 أشرطة التبويب الرئيسية (Navigation Tabs) -->
    <nav class="max-w-7xl mx-auto w-full px-4 pt-6">
        <div class="glass-panel p-2 rounded-2xl border border-royalGold/30 flex flex-wrap justify-center gap-2">
            <button onclick="switchTab('treasure-hunt')" id="tab-treasure-hunt" class="tab-active px-5 py-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-2">
                <i class="fa-solid fa-gem text-base"></i> 🗺️ مغامرة الوصول للكنز
            </button>
            <button onclick="switchTab('gis-learning')" id="tab-gis-learning" class="px-5 py-3 rounded-xl text-xs sm:text-sm font-bold text-slate-300 hover:text-royalGold transition flex items-center gap-2">
                <i class="fa-solid fa-satellite text-base"></i> 🛰️ التعلم الذكي: GIS والاستشعار
            </button>
            <button onclick="switchTab('geo-week')" id="tab-geo-week" class="px-5 py-3 rounded-xl text-xs sm:text-sm font-bold text-slate-300 hover:text-royalGold transition flex items-center gap-2">
                <i class="fa-solid fa-calendar-star text-base"></i> 📅 أسبوع الجغرافيا العماني
            </button>
            <button onclick="switchTab('virtual-tours')" id="tab-virtual-tours" class="px-5 py-3 rounded-xl text-xs sm:text-sm font-bold text-slate-300 hover:text-royalGold transition flex items-center gap-2">
                <i class="fa-solid fa-vr-cardboard text-base"></i> 🏰 رحلات افتراضية (جنوب الباطنة وبركاء)
            </button>
        </div>
    </nav>

    <!-- 🌐 المحتوى الرئيسي المتغير -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-4 sm:p-6 lg:p-8 space-y-8">

        <!-- ========================================== -->
        <!-- 🎯 1. قسم الوصول للكنز والمرحلة التفاعلية -->
        <!-- ========================================== -->
        <section id="sec-treasure-hunt" class="space-y-6">
            <!-- الهيرو الترحيبي والتوجيهي -->
            <div class="glass-panel rounded-3xl p-6 sm:p-10 text-center relative overflow-hidden border-2 border-royalGold/50 shadow-2xl">
                <div class="inline-flex items-center gap-2 bg-royalGold/2
