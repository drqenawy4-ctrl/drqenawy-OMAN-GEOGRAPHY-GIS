<!-- الجولات الرسمية 360 - استبدال إضافة الجولات القديمة فقط -->
<style>
#oman-tour-modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:999999;
  background:#071522;
  padding:12px;
}
#oman-tour-modal.active {
  display:flex;
  flex-direction:column;
}
#oman-tour-modal iframe {
  width:100%;
  flex:1;
  min-height:300px;
  border:0;
  border-radius:12px;
  background:white;
}
#oman-tour-modal .tour-actions {
  display:flex;
  gap:10px;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  color:white;
}
#oman-tour-modal button,
#oman-tour-modal a {
  border:0;
  border-radius:8px;
  padding:11px 15px;
  color:white;
  background:#087f75;
  text-decoration:none;
  cursor:pointer;
  font-weight:bold;
}
#oman-tour-modal button {background:#a83232}
</style>

<div id="oman-tour-modal">
  <div class="tour-actions">
    <strong>الجولة الافتراضية للمعلم العماني</strong>
    <button type="button" onclick="closeOmanTour()">إغلاق ✕</button>
  </div>
  <iframe id="oman-tour-frame"
    title="الجولة الافتراضية الرسمية"
    allow="fullscreen; gyroscope; accelerometer"
    allowfullscreen>
  </iframe>
  <div class="tour-actions">
    <span>إذا لم تعمل الجولة داخل النافذة:</span>
    <a id="oman-tour-link" target="_blank" rel="noopener">
      فتح الجولة في صفحة مستقلة
    </a>
  </div>
</div>

<script>
const OMAN_OFFICIAL_TOURS = {
  "جبرين":
  "https://experienceoman.om/ar/وجهات/محافظة-الداخلية/حصن-جبرين",

  "الحزم":
  "https://experienceoman.om/ar/وجهات/محافظة-جنوب-الباطنة/حصن-الحزم",

  "خصب":
  "https://stg.experienceoman.om/ar/وجهات/محافظة-مسندم/حصن-خصب",

  "مرباط":
  "https://experienceoman.om/ar/وجهات/محافظة-ظفار/حصن-مرباط",

  "صحار":
  "https://stg.experienceoman.om/en/destinations/al-batinah-north/sohar-fort"
};

function openOmanTour(name) {
  const url = OMAN_OFFICIAL_TOURS[name];
  if (!url) {
    alert("لا توجد جولة رسمية مدرجة لهذا المعلم.");
    return;
  }

  document.getElementById("oman-tour-frame").src = url;
  document.getElementById("oman-tour-link").href = url;
  document.getElementById("oman-tour-modal").classList.add("active");
}

function closeOmanTour() {
  document.getElementById("oman-tour-modal").classList.remove("active");
  document.getElementById("oman-tour-frame").src = "about:blank";
}
</script>
