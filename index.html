<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b3f">
<meta name="description" content="منصة الجغرافيا الذكية - مدرسة ثابت بن قيس للتعليم الأساسي - سلطنة عمان">
<title>الجغرافيا الذكية | مدرسة ثابت بن قيس</title>

<!-- مكتبة الخرائط Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!-- مكتبة الأيقونات الاحترافية Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
 --navy:#102b3f;--blue:#087e9e;--cyan:#39c6d6;
 --gold:#e9b949;--bg:#f1f6f8;--ink:#173042;
 --green:#20a477;--red:#df5555;--white:#fff;
 --shadow:0 10px 30px rgba(23,48,66,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{
 background:linear-gradient(135deg,#102b3f,#087e9e);
 color:white;padding:35px 15px;text-align:center;
 box-shadow:0 4px 20px #0002
}
header h1{color:#7ce7ef;margin:10px 0;font-size:32px}
header p{line-height:1.9;margin:6px;font-size:14px}
.flag{height:7px;width:120px;margin:14px auto;background:linear-gradient(to left,#16834b 33%,white 33% 66%,#df2935 66%);border-radius:5px}
.hero-icon{font-size:48px;color:#7ce7ef}
nav{
 position:sticky;top:0;z-index:1000;background:#173d55;
 padding:10px;display:flex;gap:8px;overflow-x:auto;
 box-shadow:0 4px 15px #0003
}
nav a{color:white;text-decoration:none;white-space:nowrap;background:#ffffff18;padding:10px 14px;border-radius:9px;font-size:13px;transition:.2s;display:flex;align-items:center;gap:6px}
nav a:hover{background:var(--blue)}
main{max-width:1300px;margin:auto;padding:16px}
section{background:white;border-radius:16px;padding:26px;margin:24px 0;box-shadow:var(--shadow);scroll-margin-top:80px;border:1px solid #e4edf1}
h2{color:var(--blue);margin-top:0;font-size:22px;border-bottom:2px solid var(--bg);padding-bottom:12px;display:flex;align-items:center;gap:10px}
h3{color:#173d55;display:flex;align-items:center;gap:8px}
p{line-height:1.9}
button,.btn{
 display:inline-flex;align-items:center;justify-content:center;gap:8px;
 border:0;border-radius:9px;background:var(--blue);
 color:white;padding:11px 18px;cursor:pointer;font:bold 13px Tahoma;
 text-decoration:none;margin:4px;transition:.2s
}
button:hover,.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.gold{background:var(--gold);color:#172e3d}
.dark{background:#173d55}
.green{background:var(--green)}
.red{background:var(--red)}
input,select,textarea{
 width:100%;padding:12px;border:1px solid #cbd9df;border-radius:9px;
 font:14px Tahoma;background:white;margin-top:4px;color:var(--ink)
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #087e9e22}
label{font-weight:bold;font-size:13px;display:block;margin:12px 0 6px;color:#173d55}
#map{height:520px;width:100%;border-radius:12px;margin-top:12px;background:#e4edf1;border:1px solid #cbd9df}
.maptools,.grid,.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:14px 0}
.card{background:#f7fafb;border:1px solid #dce7eb;border-radius:12px;padding:18px;transition:.2s}
.card:hover{box-shadow:0 6px 20px #087e9e20;transform:translateY(-2px)}
.card p{font-size:13px;color:#536b78}
.layers{display:flex;flex-wrap:wrap;gap:15px;padding:14px;background:#f1f6f8;border-radius:10px;margin:10px 0}
.layers label{display:flex;gap:8px;align-items:center;margin:0;cursor:pointer}
.layers input{width:auto}
.stats{background:var(--navy);color:white;padding:14px 20px;border-radius:10px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.stats strong{color:#7ce7ef;font-size:22px}
.globe-area{background:radial-gradient(circle,#164b68,#071c2b);color:white;text-align:center}
.globe-area h2{color:white;border-color:#ffffff22}
.globe-container{width:220px;height:220px;margin:20px auto;cursor:pointer}
.globe{
 width:100%;height:100%;border-radius:50%;
 background:
 radial-gradient(ellipse at 30% 35%,#8bd4a0 0 12%,transparent 13%),
 radial-gradient(ellipse at 65% 55%,#76b979 0 16%,transparent 17%),
 radial-gradient(ellipse at 40% 75%,#78ae71 0 9%,transparent 10%),
 radial-gradient(circle at 30% 25%,#9be8f3,#167eaa 48%,#032b49 80%);
 box-shadow:inset -25px -15px 35px #00132299,inset 10px 8px 22px #b6
